<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explode sample</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0908; overflow: hidden; }
  #bg { position: fixed; inset: 0; background: radial-gradient(55% 60% at 50% 45%, rgba(201,173,124,.13), transparent 70%), linear-gradient(180deg, #0f0e0d, #0a0908); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .lab { position: fixed; left: 0; top: 0; opacity: 0; font-family: 'Manrope Variable', Arial, sans-serif; color: #efe9de; white-space: nowrap; }
  .lab::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #c9ad7c; box-shadow: 0 0 0 5px rgba(201,173,124,.18); }
  .lab i { position: absolute; left: 0; width: 1px; height: var(--o); background: linear-gradient(#c9ad7c, rgba(201,173,124,.15)); }
  .lab.up i { top: calc(-1 * var(--o)); }
  .lab.down i { top: 0; background: linear-gradient(rgba(201,173,124,.15), #c9ad7c); }
  .lab b { position: absolute; left: -2px; font-size: 1.7vh; letter-spacing: .2em; text-transform: uppercase; font-weight: 650; }
  .lab b em { font-style: normal; color: #c9ad7c; margin-right: .5em; }
  .lab.up b { top: calc(-1 * var(--o) - 2.8vh); }
  .lab.down b { top: calc(var(--o) + 0.8vh); }
  #cap { position: fixed; left: 5%; bottom: 7%; font-family: 'Manrope Variable', Arial, sans-serif; color: #8f8a82; font-size: 1.6vh; letter-spacing: .3em; text-transform: uppercase; }
  #cap b { color: #efe9de; font-weight: 600; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="labs"></div>
<div id="cap"></div>
<script type="module" src="./explode-sample.js"></script>
</body>
</html>
